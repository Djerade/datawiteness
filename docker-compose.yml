services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datawitness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datawitness}
      POSTGRES_DB: ${POSTGRES_DB:-datawitness}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datawitness}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-datawitness}:${POSTGRES_PASSWORD:-datawitness}@db:5432/${POSTGRES_DB:-datawitness}
      STORAGE_DIR: /data/raw
    ports: ["8000:8000"]
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
